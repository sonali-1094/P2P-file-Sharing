server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/p2p_tracker}
    username: ${DB_USER:p2p}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: 60
  peers:
    online-window-seconds: 30
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
